<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FoodIQ — Smart Label Analyzer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo-circle">FI</div>
        <div>
          <h1>FoodIQ</h1>
          <p class="tag">Know what you eat • Food & Skin-care label analysis</p>
        </div>
      </div>
    </header>

    <!-- Mode tabs -->
    <div class="tabs">
      <button class="tab active" onclick="selectMode('food', this)">🥗 Food</button>
      <button class="tab" onclick="selectMode('skin', this)">💧 Skin-care</button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <label class="file-label">
        <input type="file" id="imageInput" accept="image/*" />
        <p id="fileName" class="fileNAme"></p>
        Choose Image
      </label>

      <button id="cameraBtn" onclick="toggleCamera()">📷 Use Camera</button>
      <button id="captureBtn" onclick="capturePhoto()" style="display:none">📸 Capture</button>

      <button id="analyzeBtn" onclick="processImage()">Analyze</button>
<div id="demoSamples">
  <p style="margin-top: 12px; font-size: 0.9rem; color: #555;">
    Don't have an image? 
    <button class="demoBtn" onclick="useDemo('food')">Try Food Demo</button>
    <button class="demoBtn" onclick="useDemo('skincare')">Try Skincare Demo</button>
  </p>
</div>

    </div>

    <!-- video preview for camera -->
    <div id="cameraWrap" style="display:none">
      <video id="video" playsinline autoplay></video>
    </div>

    <div id="loading" class="loading" aria-live="polite"></div>

    <!-- results -->
    <div id="results" class="results" hidden>
      <!-- Score -->
      <div class="scoreRow">
        <div class="scoreBox">
          <div id="scoreValue" class="scoreValue">—</div>
          <div class="scoreLabel">Health Score</div>
          <div id="scoreBar" class="scoreBar"><div id="scoreFill" class="scoreFill"></div></div>
        </div>

        <!-- Chart -->
        <div class="chartBox">
          <canvas id="nutriChart" width="200" height="200"></canvas>
        </div>
      </div>

      <!-- Nutrient details -->
      <div id="nutrients" class="card"></div>

      <!-- Ingredient tips -->
      <div id="tips" class="card"></div>

      <!-- Final verdict -->
      <div id="verdict" class="verdict"></div>
    </div>

    <footer class="footer">
      <small>Phase 2 — FoodIQ • Client-side demo. Deploy with GitHub Pages / Netlify.</small>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
