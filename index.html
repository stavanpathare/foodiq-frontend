<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FoodIQ 2.0</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="Assets/Icons/icon.png">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>FoodIQ 2.0</h2>
    <p>Upload a product label and get a health analysis.</p>

    <!-- Tab-style toggle -->
    <div class="tabs">
      <button class="tab active" onclick="selectMode('food', this)">🥗 Food</button>
      <button class="tab" onclick="selectMode('skin', this)">💧 Skin-care</button>
    </div>

    <input type="file" id="imageInput" accept="image/*">
    <button onclick="processImage()">Analyze</button>

    <div id="loading"></div>
    <div id="results"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
