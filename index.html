<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FoodIQ — Smart Label Analyzer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- TensorFlow + MobileNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo-circle">FI</div>
        <div>
          <h1>FoodIQ</h1>
          <p class="tag">Know what you eat • Food & Skin-care label analysis</p>
          <button id="profileBtn" class="profile-Btn">🧑🏽</button>
        </div>
      </div>
    </header>



    <!-- Profile Modal -->
     <div id="profileModal" class="modal">
      <div class="modal-content">
        <h2> 🧍🏽‍♂️ Your Profile</h2>
        <label> Name: </label>
        <input type="text" id="userName" placeholder="Enter your name">

        <label>Age:</label>
        <input type="number" id="userAge" placeholder="Enter your age">

        <label >Gender:</label>
        <select  id="userGender">
          <option>Male</option>
          <option>Female</option>
          <option>Others</option>
        </select>

        <label>Health Goal:</label>
        <select id="userGoal">
          <option>Maintain Health</option>
          <option>Lose Weight</option>
          <option>Gain Muscle</option>
        </select>

        <label>Allergies (comma separated):</label>
        <input type="text" id="userAllergies" placeholder="e.g. dairy, nuts">

        <label>Dietary Preference</label>
        <select  id="userDiet">
          <option>Vegetarian</option>
          <option>Non-Vegetarian</option>
          <option>Vegan</option>
        </select>
        
        <button id="sabeProfile">💾 Save Profile</button> 
        <button id="closeModal">❌ CLose</button>

      </div>
     </div>


    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" onclick="selectMode('food', this)">🥗 Food</button>
      <button class="tab" onclick="selectMode('skin', this)">💧 Skin-care</button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <label class="file-label">
        <input type="file" id="imageInput" accept="image/*" />
        <p id="fileName" class="fileName"></p>
        Choose Image
      </label>

      <button id="cameraBtn" onclick="toggleCamera()">📷 Use Camera</button>
      <button id="captureBtn" onclick="capturePhoto()" style="display:none">📸 Capture</button>

      <button id="analyzeBtn" onclick="processImage()">Analyze</button>

      <div id="demoSamples">
        <p style="margin-top: 12px; font-size: 0.9rem; color: #555;">
          Don't have an image?
          <button class="demoBtn" onclick="useDemo('food')">Try Food Demo</button>
          <button class="demoBtn" onclick="useDemo('skincare')">Try Skincare Demo</button>
        </p>
      </div>
    </div>

    <!-- AI Detection preview -->
    <div id="preview-container">
      <img id="preview" alt="Preview" style="max-width:180px;display:none;border-radius:10px;margin-top:8px;">
      <p id="detection-result" style="font-weight:600;margin-top:6px;"></p>
    </div>

    <!-- Camera -->
    <div id="cameraWrap" style="display:none">
      <video id="video" playsinline autoplay></video>
    </div>

    <div id="loading" class="loading" aria-live="polite"></div>

    <!-- Results -->
    <div id="results" class="results" hidden>
      <div class="scoreRow">
        <div class="scoreBox">
          <div id="scoreValue" class="scoreValue">—</div>
          <div class="scoreLabel">Health Score</div>
          <div id="scoreBar" class="scoreBar"><div id="scoreFill" class="scoreFill"></div></div>
        </div>
        <div class="chartBox">
          <canvas id="nutriChart" width="200" height="200"></canvas>
        </div>
      </div>

      <div id="nutrients" class="card"></div>
      <div id="tips" class="card"></div>
      <div id="verdict" class="verdict"></div>
    </div>

    <!-- Footer -->
  <footer>
    <p>&copy; 2026 Created by Stavan Labs. All rights reserved.</p>
  </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
